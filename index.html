<style>
:root{
  --purple:#6C4DF6;
  --purple-dark:#5936E0;
  --ink:#151726;
  --gray:#6B7280;
  --tagline:#6C4DF6;
  --bg:#FFFFFF;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,
body{
  width:100%;
  height:100%;
}

body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

/* ================= MAIN ================= */

.splash{
  min-height:100vh;
  display:flex;
  align-items:center;
  padding:0 8vw;
}

.card{
  width:100%;
  max-width:1200px;
  margin:0 auto;

  display:grid;
  grid-template-columns:1fr 1.15fr;

  align-items:center;
  gap:5vw;
}


.brand{
  display:flex;
  align-items:center;
  gap:14px;
  margin-bottom:44px;

  opacity:0;
  animation:riseIn .6s ease forwards .1s;
}

.brand .mark{
  width:48px;
  height:48px;

  border-radius:14px;
  background:var(--purple);

  display:flex;
  align-items:center;
  justify-content:center;

  flex-shrink:0;
}

.brand .mark svg{
  width:26px;
  height:26px;
}

.brand span{
  font-size:22px;
  font-weight:700;
  color:var(--ink);
}

h1.wordmark{
  font-size:clamp(46px,6vw,72px);
  line-height:1;

  font-weight:800;
  color:var(--ink);

  letter-spacing:-1.5px;

  opacity:0;
  animation:riseIn .6s ease forwards .22s;
}

.tagline{
  margin-top:20px;

  font-size:clamp(14px,1.3vw,16px);
  font-weight:700;

  letter-spacing:1.5px;

  color:var(--tagline);

  text-transform:uppercase;

  opacity:0;
  animation:riseIn .6s ease forwards .34s;
}

.sub{
  margin-top:18px;

  max-width:400px;

  font-size:17px;
  line-height:1.6;

  color:var(--gray);

  opacity:0;
  animation:riseIn .6s ease forwards .46s;
}



.cta{
  margin-top:38px;

  display:inline-flex;
  align-items:center;
  gap:12px;

  background:var(--purple);
  color:#fff;

  border:none;

  font-size:16px;
  font-weight:600;

  padding:16px 28px;

  border-radius:12px;

  cursor:pointer;

  box-shadow:0 18px 30px -12px rgba(108,77,246,.55);

  opacity:0;

  animation:riseIn .6s ease forwards .58s;

  transition:
    transform .22s ease,
    box-shadow .22s ease,
    background .22s ease;
}

.cta:hover{
  background:var(--purple-dark);

  transform:translateY(-2px);

  box-shadow:0 20px 32px -10px rgba(108,77,246,.65);
}

.cta:active{
  transform:translateY(0);
}

.cta:focus-visible{
  outline:3px solid var(--purple);
  outline-offset:3px;
}

.cta .arrow{
  width:32px;
  height:32px;

  border-radius:50%;

  background:rgba(255,255,255,.18);

  display:flex;
  align-items:center;
  justify-content:center;

  transition:transform .22s ease;
}

.cta:hover .arrow{
  transform:translateX(3px);
}

.cta svg{
  width:16px;
  height:16px;
}



.stage{
  position:relative;

  opacity:0;

  animation:fadeScale .7s ease forwards .3s;
}

.stage svg{
  width:100%;
  height:auto;

  display:block;
}

/* Floating people */

.float{
  animation:bob 4.6s ease-in-out infinite;
  transform-origin:center;
}

.float.two{
  animation-delay:.6s;
}

.float.three{
  animation-delay:1.1s;
}

@keyframes riseIn{

  from{
    opacity:0;
    transform:translateY(16px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes fadeScale{

  from{
    opacity:0;
    transform:scale(.94);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}

@keyframes bob{

  0%,
  100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-6px);
  }

}



@media(max-width:900px){

  .splash{
    padding:6vh 7vw;
  }

  .card{
    grid-template-columns:1fr;
  }

  .stage{
    order:-1;

    max-width:420px;

    margin:0 auto 8px;
  }

  h1.wordmark{
    font-size:46px;
  }

  .sub{
    max-width:none;
  }

}



@media(prefers-reduced-motion:reduce){

  *{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
  }

}
</style>
