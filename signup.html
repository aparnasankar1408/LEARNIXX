<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learnix — Sign Up</title>

<style>
:root{
  --purple:#6C4DF6;
  --purple-dark:#5936E0;
  --purple-soft:#EFEBFE;
  --ink:#151726;
  --gray:#6B7280;
  --border:#E5E1F7;
  --danger:#F0666B;
  --success:#22A06B;
  --bg:#FFFFFF;
}

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html,body{
  min-height:100%;
}

body{
  font-family:'Poppins-fallback','Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--bg);
  color:var(--ink);
}

.wrap{
  min-height:100vh;
  display:flex;
  align-items:center;
  padding:40px 8vw;
}

.card{
  width:100%;
  max-width:1100px;
  margin:auto;
  display:grid;
  grid-template-columns:1fr 1fr;
  align-items:center;
  gap:6vw;
}

/* ---------------- LEFT ---------------- */

.left{
  width:100%;
  max-width:470px;
  margin:auto;
}

.brand{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:28px;

  opacity:0;
  animation:riseIn .55s ease forwards;
}

.brand .mark{
  width:44px;
  height:44px;
  border-radius:13px;
  background:var(--purple);

  display:flex;
  align-items:center;
  justify-content:center;
}

.brand .mark svg{
  width:24px;
  height:24px;
}

.brand span{
  font-size:20px;
  font-weight:700;
}

/* ROLE TABS */

.tabs{
  display:inline-flex;
  background:var(--purple-soft);
  border-radius:12px;
  padding:5px;
  margin-bottom:22px;

  opacity:0;
  animation:riseIn .55s ease forwards .1s;
}

.tabs button{
  border:none;
  background:transparent;

  padding:9px 24px;

  font-size:14px;
  font-weight:600;

  color:var(--gray);

  border-radius:9px;
  cursor:pointer;

  transition:.2s;
}

.tabs button.active{
  background:var(--purple);
  color:white;

  box-shadow:0 8px 18px -8px rgba(108,77,246,.6);
}

/* TITLE */

.title{
  font-size:32px;
  font-weight:800;
  letter-spacing:-.5px;

  opacity:0;
  animation:riseIn .55s ease forwards .18s;
}

.subtitle{
  margin-top:7px;
  color:var(--gray);
  font-size:15px;

  opacity:0;
  animation:riseIn .55s ease forwards .25s;
}

/* FORM */

form{
  margin-top:24px;
}

.field{
  margin-bottom:15px;

  opacity:0;
  animation:riseIn .55s ease forwards;
}

.field:nth-child(1){
  animation-delay:.30s;
}

.field:nth-child(2){
  animation-delay:.36s;
}

.field:nth-child(3){
  animation-delay:.42s;
}

.field:nth-child(4){
  animation-delay:.48s;
}

.field label{
  display:block;

  font-size:13.5px;
  font-weight:600;

  margin-bottom:7px;
}

.input-box{
  position:relative;
}

.input-box input{
  width:100%;

  padding:12px 15px;

  font-size:14px;

  border:1.5px solid var(--border);
  border-radius:11px;

  outline:none;

  color:var(--ink);
  background:white;

  transition:.2s;
}

.input-box input:focus{
  border-color:var(--purple);

  box-shadow:
    0 0 0 4px rgba(108,77,246,.12);
}

.input-box input.error{
  border-color:var(--danger);
}

.error-msg{
  display:none;

  margin-top:5px;

  font-size:11.5px;
  color:var(--danger);
}

.error-msg.show{
  display:block;
}

/* PASSWORD BUTTON */

.toggle-pw{
  position:absolute;

  right:13px;
  top:50%;

  transform:translateY(-50%);

  background:none;
  border:none;

  cursor:pointer;

  color:var(--gray);

  display:flex;
}

.toggle-pw svg{
  width:18px;
  height:18px;
}

/* SIGNUP BUTTON */

.submit{
  width:100%;

  margin-top:5px;

  padding:14px;

  background:var(--purple);
  color:white;

  border:none;
  border-radius:12px;

  font-size:15px;
  font-weight:600;

  cursor:pointer;

  box-shadow:
    0 16px 28px -12px rgba(108,77,246,.55);

  transition:.2s;

  opacity:0;
  animation:riseIn .55s ease forwards .55s;
}

.submit:hover{
  background:var(--purple-dark);
  transform:translateY(-2px);
}

.submit:disabled{
  opacity:.7;
  cursor:not-allowed;
  transform:none;
}

/* FOOTER */

.foot{
  margin-top:20px;

  text-align:center;

  font-size:13.5px;
  color:var(--gray);

  opacity:0;
  animation:riseIn .55s ease forwards .65s;
}

.foot a{
  color:var(--purple);
  font-weight:600;
  text-decoration:none;
}

.foot a:hover{
  text-decoration:underline;
}

/* RIGHT ILLUSTRATION */

.stage{
  opacity:0;
  animation:fadeScale .7s ease forwards .25s;
}

.stage svg{
  width:100%;
  height:auto;
  display:block;
}

.float{
  animation:bob 4.6s ease-in-out infinite;
}

.float.two{
  animation-delay:.7s;
}

@keyframes riseIn{

  from{
    opacity:0;
    transform:translateY(14px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }

}

@keyframes fadeScale{

  from{
    opacity:0;
    transform:scale(.94);
  }

  to{
    opacity:1;
    transform:scale(1);
  }

}

@keyframes bob{

  0%,100%{
    transform:translateY(0);
  }

  50%{
    transform:translateY(-6px);
  }

}

@media(max-width:900px){

  .wrap{
    padding:40px 7vw;
  }

  .card{
    grid-template-columns:1fr;
  }

  .stage{
    order:-1;
    max-width:300px;
    margin:auto;
  }

  .left{
    max-width:500px;
  }

  .title{
    font-size:28px;
  }

}

@media(prefers-reduced-motion:reduce){

  *{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
  }

}
</style>
</head>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  createUserWithEmailAndPassword,
  updateProfile
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* FIREBASE CONFIG */

const firebaseConfig = {

  apiKey:
  "AIzaSyArFJw7BzXPTpwld9oNtXXRKlSHasYyMS8",

  authDomain:
  "learnix-e04e5.firebaseapp.com",

  projectId:
  "learnix-e04e5",

  storageBucket:
  "learnix-e04e5.firebasestorage.app",

  messagingSenderId:
  "542441509489",

  appId:
  "1:542441509489:web:2dce3c3740e112cbae81d0"

};


/* INITIALIZE FIREBASE */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


/* ROLE */

const tabs =
document.querySelectorAll("#roleTabs button");

let activeRole = "teacher";


tabs.forEach(button => {

  button.addEventListener("click", () => {

    tabs.forEach(btn =>
      btn.classList.remove("active")
    );

    button.classList.add("active");

    activeRole =
      button.dataset.role;

    console.log(
      "Selected role:",
      activeRole
    );

  });

});


/* INPUTS */

const form =
document.getElementById("signupForm");

const nameInput =
document.getElementById("name");

const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const confirmInput =
document.getElementById("confirmPassword");

const nameError =
document.getElementById("nameError");

const emailError =
document.getElementById("emailError");

const passwordError =
document.getElementById("passwordError");

const confirmError =
document.getElementById("confirmError");

const signupBtn =
document.getElementById("signupBtn");


/* PASSWORD SHOW/HIDE */

function togglePassword(input, button){

  button.addEventListener("click", () => {

    const hidden =
      input.type === "password";

    input.type =
      hidden ? "text" : "password";

    button.setAttribute(
      "aria-label",
      hidden
        ? "Hide password"
        : "Show password"
    );

  });

}


togglePassword(
  passwordInput,
  document.getElementById("togglePassword")
);


togglePassword(
  confirmInput,
  document.getElementById("toggleConfirm")
);


/* EMAIL VALIDATION */

function isValidEmail(email){

  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/
    .test(email);

}


/* SIGN UP */

form.addEventListener(
  "submit",
  async (event) => {

    event.preventDefault();


    const name =
      nameInput.value.trim();

    const email =
      emailInput.value.trim();

    const password =
      passwordInput.value;

    const confirmPassword =
      confirmInput.value;


    let valid = true;


    /* NAME */

    if(name.length < 2){

      nameInput.classList.add("error");
      nameError.classList.add("show");

      valid = false;

    }else{

      nameInput.classList.remove("error");
      nameError.classList.remove("show");

    }


    /* EMAIL */

    if(!isValidEmail(email)){

      emailInput.classList.add("error");
      emailError.classList.add("show");

      valid = false;

    }else{

      emailInput.classList.remove("error");
      emailError.classList.remove("show");

    }


    /* PASSWORD */

    if(password.length < 6){

      passwordInput.classList.add("error");
      passwordError.classList.add("show");

      valid = false;

    }else{

      passwordInput.classList.remove("error");
      passwordError.classList.remove("show");

    }


    /* CONFIRM PASSWORD */

    if(password !== confirmPassword){

      confirmInput.classList.add("error");
      confirmError.classList.add("show");

      valid = false;

    }else{

      confirmInput.classList.remove("error");
      confirmError.classList.remove("show");

    }


    if(!valid){
      return;
    }


    /* BUTTON */

    signupBtn.disabled = true;

    signupBtn.textContent =
      "Creating Account...";


    try{

      /* CREATE FIREBASE ACCOUNT */

      const userCredential =
        await createUserWithEmailAndPassword(
          auth,
          email,
          password
        );


      const user =
        userCredential.user;


      /* SAVE DISPLAY NAME */

      await updateProfile(
        user,
        {
          displayName: name
        }
      );


      /*
        Save selected role locally
        for the current browser.
      */

      localStorage.setItem(
        "learnixRole",
        activeRole
      );


      localStorage.setItem(
        "learnixName",
        name
      );


      alert(
        "Account created successfully!"
      );


      /* GO TO LOGIN */

      window.location.href =
        "login.html";


    }catch(error){

      console.error(
        "Firebase Signup Error:",
        error
      );


      if(
        error.code ===
        "auth/email-already-in-use"
      ){

        alert(
          "This email is already registered."
        );

      }

      else if(
        error.code ===
        "auth/weak-password"
      ){

        alert(
          "Password is too weak."
        );

      }

      else if(
        error.code ===
        "auth/invalid-email"
      ){

        alert(
          "Please enter a valid email."
        );

      }

      else{

        alert(
          "Signup failed: " +
          error.message
        );

      }


      signupBtn.disabled = false;

      signupBtn.textContent =
        "Create Account";

    }

  }
);

</script>

</body>
</html>
