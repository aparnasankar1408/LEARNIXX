<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Learnix - Interactive Quiz</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: Arial, sans-serif;
}

body {
    min-height: 100vh;
    background: #f4f5fa;
    display: flex;
    align-items: center;
    justify-content: center;
}

/* ================= QUIZ POPUP ================= */

.quiz-overlay {
    position: fixed;
    inset: 0;
    background: rgba(20, 20, 40, 0.35);

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

/* ================= QUIZ CARD ================= */

.quiz-card {
    width: 100%;
    max-width: 480px;

    background: white;

    border: 1px solid #e4e4ef;
    border-radius: 18px;

    padding: 26px;

    box-shadow: 0 15px 45px rgba(45, 35, 100, 0.15);
}

/* ================= HEADER ================= */

.quiz-header {
    display: flex;
    justify-content: space-between;
    align-items: center;

    margin-bottom: 22px;
}

.quiz-title {
    font-size: 15px;
    font-weight: bold;
    color: #252535;

    letter-spacing: 0.2px;
}

.timer {
    min-width: 60px;

    padding: 7px 11px;

    border: 2px solid #d9d1ff;
    border-radius: 20px;

    color: #552be8;

    font-size: 13px;
    font-weight: bold;

    text-align: center;
}

/* ================= QUICK QUIZ ================= */

.quick-quiz {
    font-size: 20px;
    font-weight: bold;

    color: #222233;

    margin-bottom: 7px;
}

.question-count {
    color: #888895;
    font-size: 13px;

    margin-bottom: 25px;
}

/* ================= QUESTION ================= */

.question {
    font-size: 17px;
    line-height: 1.5;

    color: #292936;

    font-weight: bold;

    margin-bottom: 20px;
}

/* ================= OPTIONS ================= */

.options {
    display: flex;
    flex-direction: column;
    gap: 10px;

    margin-bottom: 25px;
}

.option {
    width: 100%;

    min-height: 48px;

    padding: 10px 14px;

    background: white;

    border: none;

    border-radius: 9px;

    display: flex;
    align-items: center;

    cursor: pointer;

    text-align: left;

    transition: 0.2s;
}

.option:hover {
    background: #f5f2ff;
}

/* OPTION LETTER */

.option-letter {
    width: 24px;
    height: 24px;

    border: 1.5px solid #d7d7df;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    flex-shrink: 0;

    color: #8a8a95;

    font-size: 12px;
    font-weight: bold;

    margin-right: 14px;
}

/* OPTION TEXT */

.option-text {
    font-size: 14px;
    color: #555563;

    font-weight: 600;
}

/* SELECTED */

.option.selected {
    background: linear-gradient(
        90deg,
        #552be8,
        #6537f1
    );

    color: white;

    box-shadow: 0 5px 14px rgba(85, 43, 232, 0.25);
}

.option.selected .option-letter {
    border-color: white;
    color: white;
}

.option.selected .option-text {
    color: white;
}

/* CHECK MARK */

.check {
    margin-left: auto;

    font-size: 18px;

    display: none;
}

.option.selected .check {
    display: block;
}

/* ================= CORRECT / WRONG ================= */

.option.correct {
    background: #e8f8ee;
    border: 1px solid #35b86b;
}

.option.correct .option-letter {
    border-color: #35b86b;
    color: #35b86b;
}

.option.correct .option-text {
    color: #168c4a;
}

.option.wrong {
    background: #fff0f0;
    border: 1px solid #ef5353;
}

.option.wrong .option-text {
    color: #d32f2f;
}

/* ================= BUTTON AREA ================= */

.quiz-footer {
    border-top: 1px solid #eeeeef;

    padding-top: 18px;

    display: flex;
    justify-content: space-between;

    gap: 12px;
}

/* CANCEL */

.cancel-btn {
    width: 120px;

    padding: 11px;

    background: white;

    border: 1px solid #e3e3eb;

    border-radius: 9px;

    color: #666673;

    cursor: pointer;

    font-size: 13px;
    font-weight: 600;
}

.cancel-btn:hover {
    background: #f7f7fa;
}

/* NEXT */

.next-btn {
    flex: 1;

    padding: 11px;

    border: none;

    border-radius: 9px;

    background: #552be8;

    color: white;

    font-size: 13px;

    font-weight: bold;

    cursor: pointer;
}

.next-btn:hover {
    background: #4320c7;
}

.next-btn:disabled {
    background: #aaa4c5;
    cursor: not-allowed;
}

/* ================= RESULT ================= */

.result {
    display: none;

    text-align: center;

    padding: 25px 10px;
}

.result.show {
    display: block;
}

.result-icon {
    font-size: 48px;

    margin-bottom: 12px;
}

.result h2 {
    color: #552be8;

    margin-bottom: 10px;
}

.result p {
    color: #666;

    margin-bottom: 20px;
}

.restart-btn {
    border: none;

    background: #552be8;

    color: white;

    padding: 11px 25px;

    border-radius: 9px;

    cursor: pointer;
}

/* ================= TIME WARNING ================= */

.timer.warning {
    border-color: #ffb0b0;
    color: #e53935;

    animation: blink 0.8s infinite;
}

@keyframes blink {
    50% {
        opacity: 0.5;
    }
}

/* ================= RESPONSIVE ================= */

@media(max-width: 500px) {

    .quiz-card {
        padding: 20px;
    }

    .quick-quiz {
        font-size: 18px;
    }

    .question {
        font-size: 15px;
    }

    .quiz-footer {
        flex-direction: column;
    }

    .cancel-btn {
        width: 100%;
    }
}
</style>
</head>

<body>

<!-- =====================================================
     QUIZ POPUP
===================================================== -->

<div class="quiz-overlay">

    <div class="quiz-card">

        <!-- ================= QUIZ CONTENT ================= -->

        <div id="quizContent">

            <!-- HEADER -->

            <div class="quiz-header">

                <div class="quiz-title">
                    INTERACTIVE QUIZ POPUP
                </div>

                <div
                    class="timer"
                    id="timer">
                    00:30
                </div>

            </div>


            <!-- TITLE -->

            <div class="quick-quiz">
                Quick Quiz
            </div>


            <!-- QUESTION COUNT -->

            <div
                class="question-count"
                id="questionCount">
                Question 1 of 5
            </div>


            <!-- QUESTION -->

            <div
                class="question"
                id="question">
            </div>


            <!-- OPTIONS -->

            <div
                class="options"
                id="options">
            </div>


            <!-- FOOTER -->

            <div class="quiz-footer">

                <button
                    class="cancel-btn"
                    onclick="cancelQuiz()">
                    Cancel
                </button>

                <button
                    class="next-btn"
                    id="nextButton"
                    onclick="nextQuestion()">

                    Next Question
                </button>

            </div>

        </div>


        <!-- =================================================
             RESULT
        ================================================== -->

        <div
            class="result"
            id="result">

            <div class="result-icon">
                🏆
            </div>

            <h2>
                Quiz Completed!
            </h2>

            <p id="scoreText"></p>

            <button
                class="restart-btn"
                onclick="restartQuiz()">

                Try Again

            </button>

        </div>

    </div>

</div>


<script>

/* =====================================================
   QUESTIONS
===================================================== */

const questions = [

    {
        question:
        "Which SQL command removes a table from the database?",

        options: [
            "DELETE",
            "DROP",
            "TRUNCATE",
            "UPDATE"
        ],

        answer: 1
    },

    {
        question:
        "Which SQL command is used to add new records to a table?",

        options: [
            "INSERT",
            "UPDATE",
            "CREATE",
            "ALTER"
        ],

        answer: 0
    },

    {
        question:
        "Which SQL clause is used to filter records?",

        options: [
            "ORDER BY",
            "GROUP BY",
            "WHERE",
            "SELECT"
        ],

        answer: 2
    },

    {
        question:
        "Which key uniquely identifies each record in a table?",

        options: [
            "Foreign Key",
            "Primary Key",
            "Candidate Key",
            "Composite Key"
        ],

        answer: 1
    },

    {
        question:
        "Which command removes all rows from a table but keeps its structure?",

        options: [
            "DROP",
            "DELETE",
            "TRUNCATE",
            "REMOVE"
        ],

        answer: 2
    }

];


/* =====================================================
   VARIABLES
===================================================== */

let currentQuestion = 0;

let selectedAnswer = null;

let score = 0;

let timeLeft = 30;

let timerInterval;


/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

    clearInterval(timerInterval);

    timeLeft = 30;

    updateTimer();

    startTimer();

    selectedAnswer = null;

    const questionData =
        questions[currentQuestion];


    /* QUESTION COUNT */

    document.getElementById(
        "questionCount"
    ).innerText =
        `Question ${currentQuestion + 1} of ${questions.length}`;


    /* QUESTION */

    document.getElementById(
        "question"
    ).innerText =
        questionData.question;


    /* OPTIONS */

    const optionsContainer =
        document.getElementById("options");

    optionsContainer.innerHTML = "";


    questionData.options.forEach(
        (option, index) => {

            const button =
                document.createElement("button");

            button.className = "option";

            button.innerHTML = `

                <span class="option-letter">
                    ${String.fromCharCode(65 + index)}
                </span>

                <span class="option-text">
                    ${option}
                </span>

                <span class="check">
                    ✓
                </span>

            `;

            button.onclick = function() {

                selectAnswer(index, button);

            };

            optionsContainer.appendChild(button);

        }
    );


    /* NEXT BUTTON */

    const nextButton =
        document.getElementById("nextButton");

    if(currentQuestion === questions.length - 1) {

        nextButton.innerText =
            "Finish Quiz";

    } else {

        nextButton.innerText =
            "Next Question";

    }

}


/* =====================================================
   SELECT ANSWER
===================================================== */

function selectAnswer(index, button) {

    selectedAnswer = index;


    /* REMOVE PREVIOUS SELECTION */

    document
        .querySelectorAll(".option")
        .forEach(option => {

            option.classList.remove("selected");

        });


    /* SELECT CURRENT */

    button.classList.add("selected");

}


/* =====================================================
   NEXT QUESTION
===================================================== */

function nextQuestion() {

    if(selectedAnswer === null) {

        alert("Please select an answer.");

        return;

    }


    clearInterval(timerInterval);


    /* CHECK ANSWER */

    if(
        selectedAnswer ===
        questions[currentQuestion].answer
    ) {

        score++;

    }


    /* LAST QUESTION */

    if(
        currentQuestion ===
        questions.length - 1
    ) {

        showResult();

        return;

    }


    /* NEXT */

    currentQuestion++;

    loadQuestion();

}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    timerInterval =
        setInterval(function() {

            timeLeft--;

            updateTimer();


            /* TIME UP */

            if(timeLeft <= 0) {

                clearInterval(timerInterval);

                timeUp();

            }

        }, 1000);

}


/* =====================================================
   UPDATE TIMER
===================================================== */

function updateTimer() {

    const timer =
        document.getElementById("timer");

    const seconds =
        String(timeLeft).padStart(2, "0");

    timer.innerText =
        `00:${seconds}`;


    if(timeLeft <= 10) {

        timer.classList.add("warning");

    } else {

        timer.classList.remove("warning");

    }

}


/* =====================================================
   TIME UP
===================================================== */

function timeUp() {

    alert("⏰ Time's up!");

    selectedAnswer = null;


    if(currentQuestion === questions.length - 1) {

        showResult();

    } else {

        currentQuestion++;

        loadQuestion();

    }

}


/* =====================================================
   RESULT
===================================================== */

function showResult() {

    clearInterval(timerInterval);


    document.getElementById(
        "quizContent"
    ).style.display = "none";


    document.getElementById(
        "result"
    ).classList.add("show");


    document.getElementById(
        "scoreText"
    ).innerText =
        `You scored ${score} out of ${questions.length}.`;

}


/* =====================================================
   RESTART
===================================================== */

function restartQuiz() {

    currentQuestion = 0;

    score = 0;

    selectedAnswer = null;


    document.getElementById(
        "quizContent"
    ).style.display = "block";


    document.getElementById(
        "result"
    ).classList.remove("show");


    loadQuestion();

}


/* =====================================================
   CANCEL
===================================================== */

function cancelQuiz() {

    clearInterval(timerInterval);

    const confirmCancel =
        confirm("Are you sure you want to cancel the quiz?");

    if(confirmCancel) {

        document.querySelector(
            ".quiz-overlay"
        ).style.display = "none";

    }

}

function showResult() {

    clearInterval(timerInterval);

    document.getElementById("quizContent").style.display = "none";

    document.getElementById("result").classList.add("show");

    document.getElementById("scoreText").innerText =
        `You scored ${score} out of ${questions.length}.`;

    // Redirect after 3 seconds
    setTimeout(() => {
        const role = localStorage.getItem("role");

        if (role === "teacher") {
            window.location.href = "s3.html";
        } else {
            window.location.href = "s4.html";
        }
    }, 3000);
}
/* =====================================================
   START QUIZ
===================================================== */

loadQuestion();

</script>

</body>
</html>
