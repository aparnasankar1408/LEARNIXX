<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Learnix — Group Collaboration</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --indigo-600:#5B5FEF;
    --indigo-700:#4649D6;
    --indigo-50:#EFEFFE;
    --indigo-100:#E4E4FD;
    --ink-900:#1E2233;
    --ink-700:#4A4F63;
    --ink-500:#7A7F92;
    --ink-300:#B7BAC9;
    --line:#E7E8F1;
    --bg:#F5F6FB;
    --card:#FFFFFF;
    --green:#1FAE72;
    --green-bg:#E6F8EF;
    --amber:#E8A33D;
    --amber-bg:#FDF3E2;
    --blue:#3E8EF7;
    --blue-bg:#EAF2FE;
    --red:#EF5B5B;
    --radius-lg:18px;
    --radius-md:12px;
    --radius-sm:8px;
    --shadow: 0 2px 6px rgba(30,34,51,0.04), 0 10px 24px rgba(30,34,51,0.05);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--bg);
    color:var(--ink-900);
    -webkit-font-smoothing:antialiased;
  }
  .app{
    max-width:1440px;
    margin:0 auto;
    padding:22px;
  }
  .page-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:18px;
  }
  .page-title{
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .page-title .eyebrow{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.14em;
    color:var(--indigo-600);
    background:var(--indigo-50);
    padding:5px 10px;
    border-radius:999px;
  }
  .page-title h1{
    font-family:'Poppins',sans-serif;
    font-size:20px;
    font-weight:600;
    margin:0;
    color:var(--ink-900);
  }
  .page-sub{
    font-size:13px;
    color:var(--ink-500);
    margin-top:2px;
  }
  .instructions-link{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:13px;
    font-weight:600;
    color:var(--indigo-600);
    cursor:pointer;
    background:none;
    border:none;
  }
  .instructions-link svg{width:15px;height:15px;}

  .layout{
    display:grid;
    grid-template-columns:280px 1fr 280px;
    gap:18px;
    align-items:start;
  }

  .panel{
    background:var(--card);
    border-radius:var(--radius-lg);
    box-shadow:var(--shadow);
    border:1px solid var(--line);
  }

  /* ---------- LEFT: Group list ---------- */
  .groups-panel{padding:18px;}
  .groups-panel h2{
    font-family:'Poppins',sans-serif;
    font-size:14px;
    font-weight:600;
    margin:0 0 2px 0;
  }
  .groups-panel .meta{
    font-size:12px;
    color:var(--ink-500);
    margin-bottom:14px;
  }
  .group-card{
    display:flex;
    flex-direction:column;
    gap:8px;
    padding:12px;
    border-radius:var(--radius-md);
    border:1px solid var(--line);
    margin-bottom:10px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease, transform .12s ease;
    background:#fff;
  }
  .group-card:hover{ transform:translateY(-1px); }
  .group-card.active{
    border-color:var(--indigo-600);
    background:var(--indigo-50);
  }
  .group-card-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .group-name{
    display:flex;
    align-items:center;
    gap:8px;
    font-weight:600;
    font-size:13.5px;
  }
  .swatch{
    width:9px;height:9px;border-radius:3px;flex:none;
  }
  .group-task{
    font-size:11.5px;
    color:var(--ink-500);
  }
  .group-progress-row{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .progress-track{
    flex:1;
    height:6px;
    border-radius:99px;
    background:var(--line);
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    border-radius:99px;
    transition:width .4s ease;
  }
  .progress-pct{
    font-size:11px;
    font-weight:700;
    color:var(--ink-700);
    min-width:30px;
    text-align:right;
  }
  .group-foot{
    display:flex;
    align-items:center;
    gap:6px;
    font-size:11px;
    color:var(--ink-500);
  }
  .group-foot svg{width:12px;height:12px;}

  /* ---------- CENTER: Whiteboard ---------- */
  .board-panel{
    display:flex;
    flex-direction:column;
    overflow:hidden;
  }
  .board-toolbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:12px 16px;
    border-bottom:1px solid var(--line);
  }
  .board-title{
    display:flex;
    align-items:center;
    gap:8px;
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:14px;
  }
  .board-title .dot{
    width:8px;height:8px;border-radius:50%;
  }
  .toolbar-actions{
    display:flex;
    align-items:center;
    gap:8px;
  }
  .icon-btn{
    width:32px;height:32px;
    border-radius:9px;
    border:1px solid var(--line);
    background:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    color:var(--ink-700);
    transition:background .15s ease, border-color .15s ease, color .15s;
  }
  .icon-btn:hover{ background:var(--indigo-50); border-color:var(--indigo-100); color:var(--indigo-700);}
  .icon-btn.active{ background:var(--indigo-600); border-color:var(--indigo-600); color:#fff;}
  .icon-btn svg{ width:16px; height:16px; }

  .color-dot{
    width:20px;height:20px;border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 0 0 1px var(--line);
    cursor:pointer;
  }
  .color-dot.active{ box-shadow:0 0 0 2px var(--indigo-600); }

  .canvas-wrap{
    position:relative;
    flex:1;
    background:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size:22px 22px;
    background-color:#FCFCFF;
    min-height:420px;
  }
  #board{
    width:100%;
    height:100%;
    display:block;
    touch-action:none;
    cursor:crosshair;
  }
  .board-hint{
    position:absolute;
    top:12px; left:12px;
    font-size:11px;
    color:var(--ink-500);
    background:rgba(255,255,255,.85);
    padding:5px 10px;
    border-radius:999px;
    border:1px solid var(--line);
    pointer-events:none;
  }
  .board-footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:10px 16px;
    border-top:1px solid var(--line);
  }
  .zoom-controls{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12px;
    color:var(--ink-500);
  }
  .zoom-controls button{
    width:24px;height:24px;
    border-radius:6px;
    border:1px solid var(--line);
    background:#fff;
    cursor:pointer;
    font-size:14px;
    color:var(--ink-700);
  }
  .clear-btn{
    font-size:12px;
    font-weight:600;
    color:var(--ink-500);
    background:none;
    border:none;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:5px;
  }
  .clear-btn:hover{ color:var(--red); }

  /* ---------- RIGHT: Members + chat ---------- */
  .right-col{
    display:flex;
    flex-direction:column;
    gap:18px;
  }
  .members-panel{padding:16px;}
  .members-panel h2, .chat-panel h2{
    font-family:'Poppins',sans-serif;
    font-size:13.5px;
    font-weight:600;
    margin:0 0 12px 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .members-panel h2 .count{
    font-size:11px;
    font-weight:600;
    color:var(--indigo-600);
    background:var(--indigo-50);
    padding:2px 8px;
    border-radius:999px;
  }
  .member-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:7px 0;
  }
  .avatar{
    width:32px;height:32px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;
    color:#fff;
    flex:none;
    position:relative;
  }
  .avatar.online:after{
    content:'';
    position:absolute;
    bottom:-1px; right:-1px;
    width:9px;height:9px;
    background:var(--green);
    border-radius:50%;
    border:2px solid #fff;
  }
  .member-info{ display:flex; flex-direction:column; line-height:1.3; }
  .member-name{ font-size:12.5px; font-weight:600; }
  .member-role{ font-size:11px; color:var(--ink-500); }

  .group-chat-block{
    margin-top:6px;
    padding-top:12px;
    border-top:1px solid var(--line);
  }
  .group-chat-title{
    font-size:11.5px;
    font-weight:700;
    color:var(--ink-500);
    text-transform:uppercase;
    letter-spacing:.05em;
    margin-bottom:8px;
  }
  .chat-preview-msg{
    font-size:12px;
    color:var(--ink-700);
    background:var(--bg);
    padding:8px 10px;
    border-radius:10px;
    margin-bottom:6px;
  }
  .chat-preview-msg b{ color:var(--ink-900); }

  .chat-panel{
    padding:16px;
    display:flex;
    flex-direction:column;
    flex:1;
  }
  .chat-messages{
    flex:1;
    display:flex;
    flex-direction:column;
    gap:10px;
    max-height:260px;
    overflow-y:auto;
    padding-right:2px;
    margin-bottom:10px;
  }
  .chat-msg{
    display:flex;
    gap:8px;
    align-items:flex-start;
  }
  .chat-msg .avatar{ width:26px;height:26px; font-size:10.5px; }
  .chat-bubble{
    background:var(--bg);
    border-radius:10px;
    padding:7px 10px;
    font-size:12px;
    color:var(--ink-900);
    max-width:190px;
  }
  .chat-bubble .who{
    font-weight:700;
    font-size:11px;
    color:var(--indigo-700);
    display:block;
    margin-bottom:2px;
  }
  .chat-input-row{
    display:flex;
    align-items:center;
    gap:8px;
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px 6px 6px 14px;
  }
  .chat-input-row input{
    flex:1;
    border:none;
    outline:none;
    font-size:12.5px;
    font-family:'Inter',sans-serif;
    background:transparent;
  }
  .send-btn{
    width:30px;height:30px;
    border-radius:50%;
    background:var(--indigo-600);
    border:none;
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    flex:none;
    transition:background .15s ease;
  }
  .send-btn:hover{ background:var(--indigo-700); }
  .send-btn svg{ width:14px; height:14px; }

  ::-webkit-scrollbar{ width:6px; }
  ::-webkit-scrollbar-thumb{ background:var(--ink-300); border-radius:99px; }

  @media (max-width: 1080px){
    .layout{ grid-template-columns:1fr; }
    .board-panel{ order:-1; }
  }
</style>
</head>
<body>
<div class="app">

  <div class="page-header">
    <div>
      <div class="page-title">
        <span class="eyebrow">GROUP COLLABORATION</span>
      </div>
      <h1 style="margin-top:6px;">DBMS – Normalization</h1>
      <div class="page-sub">3 Groups · 15:00 min left</div>
    </div>
    <button class="instructions-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
      View Instructions
    </button>
  </div>

  <div class="layout">

    <!-- LEFT: Group Activity -->
    <div class="panel groups-panel">
      <h2>Group Activity</h2>
      <div class="meta">Tap a group to open its board</div>
      <div id="groupList"></div>
    </div>

    <!-- CENTER: Whiteboard -->
    <div class="panel board-panel">
      <div class="board-toolbar">
        <div class="board-title">
          <span class="dot" id="boardDot"></span>
          <span id="boardTitle">Group A — ER Diagram</span>
        </div>
        <div class="toolbar-actions" id="colorDots"></div>
        <div class="toolbar-actions">
          <button class="icon-btn active" id="tool-pen" title="Pen">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
          </button>
          <button class="icon-btn" id="tool-eraser" title="Eraser">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7l-5-5 9-9 9 9-4 5"/><path d="M7 20 3 16"/></svg>
          </button>
        </div>
      </div>
      <div class="canvas-wrap">
        <canvas id="board"></canvas>
        <div class="board-hint">Draw with your mouse or finger</div>
      </div>
      <div class="board-footer">
        <button class="clear-btn" id="clearBoard">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
          Clear board
        </button>
        <div class="zoom-controls">
          <button id="zoomOut">–</button>
          <span id="zoomLabel">100%</span>
          <button id="zoomIn">+</button>
        </div>
      </div>
    </div>

    <!-- RIGHT: Members + Chat -->
    <div class="right-col">
      <div class="panel members-panel">
        <h2>Members <span class="count" id="memberCount">3</span></h2>
        <div id="memberList"></div>
        <div class="group-chat-block">
          <div class="group-chat-title">Group focus</div>
          <div class="chat-preview-msg" id="focusNote"><b>Task:</b> Draw the ER diagram for Student–Course tables.</div>
        </div>
      </div>

      <div class="panel chat-panel">
        <h2>Group Chat</h2>
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input id="chatInput" type="text" placeholder="Message your group…" maxlength="140">
          <button class="send-btn" id="chatSend" title="Send">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
(function(){

  const GROUPS = [
    {
      id:'A', name:'Group A', color:'#5B5FEF', task:'ER Diagram', progress:75,
      members:[
        {name:'Aparna S', role:'Teacher', color:'#5B5FEF', online:true},
        {name:'Rahul K', role:'Student', color:'#3E8EF7', online:true},
        {name:'Priya R', role:'Student', color:'#E8A33D', online:false}
      ],
      focus:'Draw the ER diagram for Student–Course tables.',
      chat:[
        {who:'Aparna S', text:'Let’s start with the primary keys first.', me:false},
        {who:'Rahul K', text:'On it — Student ID and Course ID.', me:false},
        {who:'You', text:'I’ll draw the relationship lines.', me:true}
      ]
    },
    {
      id:'B', name:'Group B', color:'#1FAE72', task:'Normalization', progress:60,
      members:[
        {name:'Deepasree', role:'Student', color:'#1FAE72', online:true},
        {name:'Balamithra D', role:'Student', color:'#EF5B5B', online:true},
        {name:'Akash M', role:'Student', color:'#5B5FEF', online:false}
      ],
      focus:'Convert the 1NF table into 2NF form.',
      chat:[
        {who:'Deepasree', text:'Remove the partial dependency first.', me:false},
        {who:'Balamithra D', text:'Got it, splitting the table now.', me:false}
      ]
    },
    {
      id:'C', name:'Group C', color:'#E8A33D', task:'SQL Queries', progress:40,
      members:[
        {name:'Priya R', role:'Student', color:'#E8A33D', online:true},
        {name:'Akash M', role:'Student', color:'#5B5FEF', online:true}
      ],
      focus:'Write a query to join Student and Course tables.',
      chat:[
        {who:'Priya R', text:'Should we use INNER JOIN here?', me:false},
        {who:'You', text:'Yes, on CourseID.', me:true}
      ]
    }
  ];

  const COLORS = ['#1E2233','#5B5FEF','#EF5B5B','#1FAE72','#E8A33D'];
  let activeColor = COLORS[0];
  let activeGroupIdx = 0;
  let tool = 'pen';
  let zoom = 100;

  const groupListEl = document.getElementById('groupList');
  const memberListEl = document.getElementById('memberList');
  const memberCountEl = document.getElementById('memberCount');
  const boardTitleEl = document.getElementById('boardTitle');
  const boardDotEl = document.getElementById('boardDot');
  const focusNoteEl = document.getElementById('focusNote');
  const chatMessagesEl = document.getElementById('chatMessages');
  const colorDotsEl = document.getElementById('colorDots');

  function initials(name){
    return name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase();
  }

  function renderGroups(){
    groupListEl.innerHTML = '';
    GROUPS.forEach((g, idx)=>{
      const card = document.createElement('div');
      card.className = 'group-card' + (idx===activeGroupIdx ? ' active' : '');
      card.innerHTML = `
        <div class="group-card-top">
          <div class="group-name"><span class="swatch" style="background:${g.color}"></span>${g.name}</div>
        </div>
        <div class="group-task">${g.task}</div>
        <div class="group-progress-row">
          <div class="progress-track"><div class="progress-fill" style="width:${g.progress}%;background:${g.color}"></div></div>
          <div class="progress-pct">${g.progress}%</div>
        </div>
        <div class="group-foot">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
          ${g.members.length} Members
        </div>
      `;
      card.addEventListener('click', ()=>{
        activeGroupIdx = idx;
        renderAll();
        clearCanvas();
      });
      groupListEl.appendChild(card);
    });
  }

  function renderMembers(){
    const g = GROUPS[activeGroupIdx];
    memberCountEl.textContent = g.members.length;
    memberListEl.innerHTML = '';
    g.members.forEach(m=>{
      const row = document.createElement('div');
      row.className = 'member-row';
      row.innerHTML = `
        <div class="avatar ${m.online?'online':''}" style="background:${m.color}">${initials(m.name)}</div>
        <div class="member-info">
          <span class="member-name">${m.name}</span>
          <span class="member-role">${m.role}</span>
        </div>
      `;
      memberListEl.appendChild(row);
    });
    focusNoteEl.innerHTML = `<b>Task:</b> ${g.focus}`;
  }

  function renderChat(){
    const g = GROUPS[activeGroupIdx];
    chatMessagesEl.innerHTML = '';
    g.chat.forEach(m=>{
      const row = document.createElement('div');
      row.className = 'chat-msg';
      if(m.me){
        row.style.flexDirection = 'row-reverse';
      }
      const member = g.members.find(mm=>mm.name===m.who);
      const color = member ? member.color : '#5B5FEF';
      row.innerHTML = `
        <div class="avatar" style="background:${color}">${m.me ? 'You' : initials(m.who)}</div>
        <div class="chat-bubble"><span class="who">${m.who}</span>${m.text}</div>
      `;
      chatMessagesEl.appendChild(row);
    });
    chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
  }

  function renderBoardHeader(){
    const g = GROUPS[activeGroupIdx];
    boardTitleEl.textContent = `${g.name} — ${g.task}`;
    boardDotEl.style.background = g.color;
  }

  function renderColorDots(){
    colorDotsEl.innerHTML = '';
    COLORS.forEach(c=>{
      const dot = document.createElement('div');
      dot.className = 'color-dot' + (c===activeColor ? ' active' : '');
      dot.style.background = c;
      dot.addEventListener('click', ()=>{
        activeColor = c;
        tool = 'pen';
        setTool('pen');
        renderColorDots();
      });
      colorDotsEl.appendChild(dot);
    });
  }

  function renderAll(){
    renderGroups();
    renderMembers();
    renderChat();
    renderBoardHeader();
    renderColorDots();
  }

  // ---- Chat send ----
  document.getElementById('chatSend').addEventListener('click', sendMessage);
  document.getElementById('chatInput').addEventListener('keydown', e=>{
    if(e.key === 'Enter') sendMessage();
  });
  function sendMessage(){
    const input = document.getElementById('chatInput');
    const text = input.value.trim();
    if(!text) return;
    GROUPS[activeGroupIdx].chat.push({who:'You', text, me:true});
    input.value = '';
    renderChat();
  }

  // ---- Canvas drawing ----
  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  let drawing = false;
  let last = {x:0,y:0};

  function resizeCanvas(){
    const wrap = canvas.parentElement;
    const ratio = window.devicePixelRatio || 1;
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width * ratio;
    canvas.height = rect.height * ratio;
    canvas.style.width = rect.width + 'px';
    canvas.style.height = rect.height + 'px';
    ctx.setTransform(ratio,0,0,ratio,0,0);
  }
  window.addEventListener('resize', resizeCanvas);

  function getPos(e){
    const rect = canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return { x: clientX - rect.left, y: clientY - rect.top };
  }

  function startDraw(e){
    drawing = true;
    last = getPos(e);
  }
  function draw(e){
    if(!drawing) return;
    const pos = getPos(e);
    ctx.beginPath();
    ctx.moveTo(last.x, last.y);
    ctx.lineTo(pos.x, pos.y);
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    if(tool === 'eraser'){
      ctx.strokeStyle = '#FCFCFF';
      ctx.lineWidth = 22;
    } else {
      ctx.strokeStyle = activeColor;
      ctx.lineWidth = 2.5;
    }
    ctx.stroke();
    last = pos;
    e.preventDefault();
  }
  function endDraw(){ drawing = false; }

  canvas.addEventListener('mousedown', startDraw);
  canvas.addEventListener('mousemove', draw);
  window.addEventListener('mouseup', endDraw);
  canvas.addEventListener('touchstart', startDraw, {passive:false});
  canvas.addEventListener('touchmove', draw, {passive:false});
  canvas.addEventListener('touchend', endDraw);

  function clearCanvas(){
    ctx.clearRect(0,0,canvas.width,canvas.height);
    drawSeedDoodle();
  }

  document.getElementById('clearBoard').addEventListener('click', clearCanvas);

  // Tool buttons
  const toolPen = document.getElementById('tool-pen');
  const toolEraser = document.getElementById('tool-eraser');
  function setTool(t){
    tool = t;
    toolPen.classList.toggle('active', t==='pen');
    toolEraser.classList.toggle('active', t==='eraser');
  }
  toolPen.addEventListener('click', ()=>setTool('pen'));
  toolEraser.addEventListener('click', ()=>setTool('eraser'));

  // Zoom controls
  const zoomLabel = document.getElementById('zoomLabel');
  document.getElementById('zoomIn').addEventListener('click', ()=>{
    zoom = Math.min(200, zoom+10);
    zoomLabel.textContent = zoom + '%';
    canvas.style.transform = `scale(${zoom/100})`;
    canvas.style.transformOrigin = 'top left';
  });
  document.getElementById('zoomOut').addEventListener('click', ()=>{
    zoom = Math.max(50, zoom-10);
    zoomLabel.textContent = zoom + '%';
    canvas.style.transform = `scale(${zoom/100})`;
    canvas.style.transformOrigin = 'top left';
  });

  // Seed doodle
  function drawSeedDoodle(){
    ctx.save();
    ctx.strokeStyle = '#C9CBEB';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4,4]);
    ctx.strokeRect(40, 40, 120, 60);
    ctx.strokeRect(240, 40, 120, 60);
    ctx.beginPath();
    ctx.moveTo(160, 70);
    ctx.lineTo(240, 70);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#8A8DBF';
    ctx.font = '12px Inter, sans-serif';
    ctx.fillText('Student', 68, 74);
    ctx.fillText('Course', 270, 74);
    ctx.restore();
  }

  // init
  renderAll();
  requestAnimationFrame(()=>{
    resizeCanvas();
    drawSeedDoodle();
  });

})();
</script>
</body>
</html>
